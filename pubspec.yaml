name: piqueo_fifo_centeno
description: "Retail Manager Logistics & Warehouse — demo de logística de almacén y piqueo FIFO para Centeno Tire (Retail Manager)."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: any
  collection: ^1.19.1
  http: ^1.6.0
  crypto: ^3.0.7
  archive: ^4.5.2
  rm_core:
    path: packages/rm_core
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pruebas del modo cliente contra un servidor real en el mismo proceso.
  rm_server:
    path: server

flutter:
  uses-material-design: true
  assets:
    - assets/
  # Tipografías de Google Fonts empaquetadas localmente (OFL) para que el demo
  # funcione sin conexión y sin el hook nativo del paquete google_fonts.
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
